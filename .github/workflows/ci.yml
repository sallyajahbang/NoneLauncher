name: RustCraft CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustcraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxfixes-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-linux-x86_64
          path: target/release/rustcraft
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check all targets
        run: cargo check --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-windows-x86_64
          path: target/release/rustcraft.exe
          if-no-files-found: error
          retention-days: 14

  android-arm64:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$NDK_PATH"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

      - name: Install Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          build-root-directory: platforms/android

      - name: Build Android debug APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android native library
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-native
          path: platforms/android/app/src/main/jniLibs/arm64-v8a/librustcraft.so
          if-no-files-found: error
          retention-days: 14
