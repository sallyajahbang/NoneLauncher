[package]
name = "rustrowser"
version = "0.1.0"
edition = "2021"
description = "RustRowser - browser ringan berbasis Rust untuk Android"
license = "MIT"

[lib]
name = "rustrowser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustrowser"
path = "src/main.rs"

[dependencies]
# GUI (egui) - ringan, tanpa WebView, cocok untuk Android via NativeActivity
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",        # backend Linux (dibutuhkan winit di CI & desktop)
    "wayland",
    "android-native-activity",
] }
# HTTP blocking dengan rustls (tanpa OpenSSL, mudah dicross-compile)
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Parser HTML (html5ever di belakangnya)
scraper = { version = "0.20", default-features = false }
url = "2"

[profile.release]
opt-level = "s"     # ukuran biner kecil = RAM & storage lebih hemat
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Khusus Android: NativeActivity (versi 0.6 cocok dengan winit 0.30 yang dipakai eframe 0.31)
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# ---- Metadata untuk cargo-apk (build APK di GitHub Actions) ----
[package.metadata.android]
package = "dev.buntuk.rustrowser"
apk_label = "RustRowser"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "RustRowser"

# Keystore rilis khusus CI (dibuat otomatis di workflow, BUKAN untuk Play Store).
[package.metadata.android.signing.release]
path = "ci-release.keystore"
keystore_password = "rustrowser-ci"
