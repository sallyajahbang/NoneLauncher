name: Build Sally Launcher APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sally-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicit package IDs avoid the retired legacy `tools` package that made
          # setup-android@v3 fail before Gradle could start.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          ./gradlew --version

      - name: Run input mapping, engine compatibility, and callback bridge unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sally-launcher-build-reports
          path: app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sally-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
