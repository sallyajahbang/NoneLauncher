[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Independent Rust voxel game runtime foundation"
license = "MIT OR Apache-2.0"

[lib]
name = "rustcraft"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
glam = { version = "0.30", features = ["bytemuck"] }

# eframe uses egui + egui-wgpu; wgpu is the actual GPU backend.
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
    "android-native-activity",
] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[package.metadata.android]
package = "dev.rustcraft.game"
apk_name = "RustCraft"
label = "RustCraft"
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "RustCraft"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
