name: RustCraft Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustcraft-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$NDK_PATH"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

      - name: Install Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          build-root-directory: platforms/android
          cache-provider: basic

      - name: Build Android debug APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-native
          path: platforms/android/app/src/main/jniLibs/arm64-v8a/librustcraft.so
          if-no-files-found: error
          retention-days: 14
