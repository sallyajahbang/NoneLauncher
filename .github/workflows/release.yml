name: RustCraft Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android-release:
    name: Android ARM64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$NDK_PATH"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

      - name: Install Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-release

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          build-root-directory: platforms/android
          cache-provider: basic

      - name: Build Android release APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
