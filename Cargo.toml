[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Android-native independent Rust voxel game runtime foundation"
license = "MIT OR Apache-2.0"

[lib]
name = "rustcraft"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
android_logger = "0.15"
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

# eframe provides egui and its wgpu renderer. Only the Android native
# activity backend is enabled; desktop window backends are intentionally off.
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "android-native-activity",
] }

# Foundation dependencies reserved for the upcoming voxel renderer/chunk work.
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[package.metadata.android]
package = "dev.rustcraft.game"
apk_name = "RustCraft"
label = "RustCraft"
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "RustCraft"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false

