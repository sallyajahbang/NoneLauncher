plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sally.launcher'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.sally.launcher'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    packagingOptions {
        jniLibs {
            // Ensure System.loadLibrary and the runtime linker can find the bundled engine libraries.
            useLegacyPackaging true
            pickFirsts += ['**/libbytehook.so', '**/libshadowhook.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    // Keep native exit-hook behavior aligned with Pojav on current Android releases.
    implementation 'com.bytedance:bytehook:1.1.2'

    testImplementation 'junit:junit:4.13.2'
    // Use the real JSON implementation in local JVM tests instead of Android's stub android.jar classes.
    testImplementation 'org.json:json:20240303'
}

// ByteHook 1.1.x requires this upstream workaround for its x86/x86_64 Prefab metadata.
apply from: rootProject.file('gradle/prefab_bypass.gradle')
