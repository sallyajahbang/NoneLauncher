// ByteHook 1.1.x publishes ARM shadowhook prefab metadata. Its own upstream workaround
// adds placeholder metadata for x86/x86_64 so CMake can configure all four requested ABIs.
project.afterEvaluate {
    def archList = ["x86", "x86_64"]
    def configurePrefabForTask = { taskName, arch, dirName, abiName ->
        def task = tasks.findByName("${taskName}[$arch]")
        if (task != null) {
            task.doFirst {
                def prefabPackageFiles = abi.variant.prefabPackages.files
                for (File file : prefabPackageFiles) {
                    def libsDir = findFirstLibsSubdirectory(file)
                    if (libsDir == null) continue
                    def libsArchDir = new File(libsDir, dirName)
                    if (!libsArchDir.exists()) {
                        libsArchDir.mkdirs()
                        def abiJsonFile = new File(libsArchDir, "abi.json")
                        def abiContent = """
                            {
                              "abi": "$abiName",
                              "api": 16,
                              "ndk": 23,
                              "stl": "none",
                              "static": false
                            }""".stripIndent()
                        abiJsonFile.write(abiContent)
                        new File(libsArchDir, "libshadowhook.so").createNewFile()
                    }
                }
            }
        }
    }
    for (arch in archList) {
        configurePrefabForTask("configureCMakeDebug", arch, "android.$arch", arch)
        configurePrefabForTask("configureCMakeRelWithDebInfo", arch, "android.$arch", arch)
        configurePrefabForTask("configureCMakeRelease", arch, "android.$arch", arch)
    }
}

def findFirstLibsSubdirectory(File baseDir) {
    if (!baseDir.exists() || !baseDir.isDirectory()) return null
    def result = null
    baseDir.eachFileRecurse(groovy.io.FileType.DIRECTORIES) { dir ->
        if (dir.name == 'libs') {
            result = dir
            return true
        }
    }
    return result
}
