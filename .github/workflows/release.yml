name: RustCraft Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxfixes-dev \
            libxrender-dev libgl1-mesa-dev libvulkan-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: rustcraft-linux-x86_64
          path: target/release/rustcraft
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: rustcraft-windows-x86_64
          path: target/release/rustcraft.exe
          if-no-files-found: error

  android:
    name: Android ARM64 release APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$NDK_PATH"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          build-root-directory: platforms/android
      - name: Build Android release APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: rustcraft-android-arm64-release
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
